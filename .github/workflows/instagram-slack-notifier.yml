name: Instagram Slack Notifier

on:
  schedule:
    # Try multiple times during the 11:00 KST hour to reduce GitHub schedule drift.
    - cron: "5-55/10 11 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force_notify:
        description: Send the current latest Instagram post to Slack as a manual test
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create runtime config
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/config.json" <<EOF
          {
            "instagram_username": "lunch11_14",
            "instagram_profile_url": "https://www.instagram.com/lunch11_14/",
            "slack_webhook_url": "${{ secrets.SLACK_WEBHOOK_URL }}",
            "state_file": "${{ github.workspace }}/.instagram_state.json",
            "notify_on_first_run": false
          }
          EOF

      - name: Run notifier
        shell: bash
        run: |
          args=(--config "$RUNNER_TEMP/config.json")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_notify }}" = "true" ]; then
            args+=(--force-notify)
          fi

          python instagram_slack_notifier.py "${args[@]}"

      - name: Commit updated state
        shell: bash
        run: |
          if [ -z "$(git status --short -- .instagram_state.json)" ]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .instagram_state.json
          git commit -m "Update Instagram notifier state"
          git push origin "HEAD:${{ github.ref_name }}"
