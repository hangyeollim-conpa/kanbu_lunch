name: Instagram protocol probe
on:
  push:
    branches: [codex/instagram-host-comparison]
    paths: [.github/workflows/instagram-protocol-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - name: Verify cloud retrieval and image without Slack or state writes
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import hashlib, json, os, socket
          from urllib.parse import urlsplit
          from dataclasses import asdict
          import urllib.request
          from pathlib import Path
          from instagram_apify import select_latest_apify_post
          state = Path('.instagram_state.json')
          before = state.read_bytes()
          request = urllib.request.Request('https://api.apify.com/v2/acts/apify~instagram-scraper/runs/last/dataset/items?status=SUCCEEDED', headers={'Authorization': 'Bearer ' + os.environ['APIFY_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              post = select_latest_apify_post('lunch11_14', response.read())
          Path('public-post.json').write_text(json.dumps(asdict(post)))
          host = urlsplit(post.display_url).hostname
          print('IMAGE_HOST', host, socket.getaddrinfo(host, 443), flush=True)
          print('LATEST', post.shortcode, post.timestamp, flush=True)
          assert post.shortcode == 'DdTGcFvz696', 'MATCHING FAILED: differs from PC verification'
          assert post.timestamp == 1789454821, 'MATCHING FAILED: publication timestamp differs'
          with urllib.request.urlopen(post.display_url, timeout=30) as image:
              body = image.read()
              print('IMAGE', image.status, image.headers.get('Content-Type'), len(body),
                    hashlib.sha256(body).hexdigest(), flush=True)
              assert image.status == 200 and image.headers.get_content_type().startswith('image/')
              assert body.startswith(b'\xff\xd8\xff'), 'MATCHING FAILED: not the expected JPEG'
          assert state.read_bytes() == before
          print('VERIFIED: actual cloud post and image; no Slack request; state unchanged')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-post-diagnostic
          path: public-post.json
          retention-days: 1
